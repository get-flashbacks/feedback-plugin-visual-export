name: custom-checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate manifest paths
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('plugin.json').read_text(encoding='utf-8'))
          assert manifest['id'] == 'visual_export'
          for key in ('script', 'styles', 'routes'):
              assert Path(manifest[key]).is_file(), f'missing {key}: {manifest[key]}'
          assert Path(manifest['settings']['html']).is_file()
          for section in ('settings', 'diagnostics'):
              for entry in (manifest.get(section, {}) or {}).get('server_files', []) or []:
                  parts = entry.split('/')
                  assert not (entry.startswith('/') or '..' in parts or '\\\\' in entry or entry.startswith('.')), entry
          PY
      - name: Check JavaScript syntax
        run: node --check screen.js
      - name: Reject print calls in routes
        run: |
          ! grep -nE '(^|[^A-Za-z0-9_])(print|traceback\\.print_exc)[[:space:]]*\\(' routes.py
      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Run route tests
        run: python -m pytest -q tests/
