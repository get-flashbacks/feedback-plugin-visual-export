version: 2
updates:
  # Keep GitHub Actions up to date, including SHA-pinned actions —
  # Dependabot resolves the SHA to the tag it corresponds to and opens
  # a PR bumping to the new release's SHA, keeping the pin fresh
  # without giving up commit-pinning.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # Patch/minor bumps get a PR opened normally; major version bumps
    # (which can change an action's inputs/outputs) are excluded
    # entirely, so they never get a PR without a human deciding to
    # bump manually. No auto-merge is configured in this repo — every
    # Dependabot PR, including patch/minor ones, still needs a human
    # to review and merge it.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
