<div class="visual-export-settings">
  <fieldset><legend>Default video</legend>
    <label>Resolution<select data-setting="resolution">
      <option value="1280x720">1280 × 720</option><option value="1920x1080">1920 × 1080</option>
      <option value="2560x1440">2560 × 1440</option><option value="3840x2160">3840 × 2160</option>
    </select></label>
    <label>Frame rate<select data-setting="fps"><option>24</option><option>30</option><option>60</option></select></label>
    <label>Bitrate (Mbps)<input type="number" min="2" max="80" data-setting="bitrate_mbps"></label>
  </fieldset>
  <button class="visual-export-settings__save-button" data-role="save-settings">Save defaults</button>
</div>
<script>
(function () {
  const panel = document.querySelector('.visual-export-settings');
  if (!panel) return;
  fetch('/api/plugins/visual_export/settings').then(r => r.json()).then(s => {
    panel.querySelector('[data-setting="resolution"]').value = `${s.width}x${s.height}`;
    panel.querySelector('[data-setting="fps"]').value = String(s.fps);
    panel.querySelector('[data-setting="bitrate_mbps"]').value = s.bitrate_mbps;
  }).catch(() => {});
  panel.querySelector('[data-role="save-settings"]').addEventListener('click', async () => {
    const [width, height] = panel.querySelector('[data-setting="resolution"]').value.split('x').map(Number);
    const body = { width, height, fps: Number(panel.querySelector('[data-setting="fps"]').value),
      bitrate_mbps: Number(panel.querySelector('[data-setting="bitrate_mbps"]').value),
      include_chrome: false };
    const r = await fetch('/api/plugins/visual_export/settings', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
  });
})();
</script>
